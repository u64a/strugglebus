name: Windows release

# Tests and builds StruggleBus Monitor for a release. Runs only when a tag
# named windows/vX.Y.Z is pushed, which needs write access to this repository.
#
# It publishes nothing and holds no secrets. The code-signing key only works
# on the owner's PC, so app/windows/release-signed.ps1, run there, downloads
# the builds this workflow keeps, signs them and publishes the release.
on:
  push:
    tags:
      - 'windows/v*'

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_PATH: app\windows\StruggleBusMonitor\StruggleBusMonitor.csproj
  TEST_PROJECT_PATH: app\windows\StruggleBusMonitor.Tests\StruggleBusMonitor.Tests.csproj

jobs:
  test:
    name: Test Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run Windows tests
        shell: pwsh
        run: dotnet test $env:TEST_PROJECT_PATH -c Release

  build:
    name: Build ${{ matrix.runtime }}
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        runtime: [win-x64, win-arm64]

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The tag here is windows/v1.7.0. The releases repository and the installed app's updater
      # know the release as v1.7.0, as they always have.
      - name: Derive release version
        id: version
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ($env:TAG_NAME -notmatch '^windows/v(\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?)$') {
            throw "Tag '$env:TAG_NAME' is not windows/v followed by a supported semantic version."
          }
          "value=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Build ${{ matrix.runtime }}
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT_PATH `
            -c Release `
            -r ${{ matrix.runtime }} `
            --self-contained true `
            -p:UseAppHost=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:ContinuousIntegrationBuild=true `
            -p:Version=${{ steps.version.outputs.value }} `
            -o .\publish

      # Unsigned. release-signed.ps1 downloads this by name, signs it and publishes.
      - name: Keep the build for signing
        uses: actions/upload-artifact@v4
        with:
          name: publish-${{ matrix.runtime }}
          path: publish
          if-no-files-found: error
          retention-days: 14
