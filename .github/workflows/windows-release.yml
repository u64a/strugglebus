name: Windows release

# Builds StruggleBus Monitor and publishes it to the releases repository the
# installed app checks for updates. Runs only when a tag named windows/vX.Y.Z
# is pushed, which needs write access to this repository.
on:
  push:
    tags:
      - 'windows/v*'

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_PATH: app\windows\StruggleBusMonitor\StruggleBusMonitor.csproj
  TEST_PROJECT_PATH: app\windows\StruggleBusMonitor.Tests\StruggleBusMonitor.Tests.csproj
  ICON_PATH: app\windows\StruggleBusMonitor\icon.ico
  DESTINATION_REPOSITORY: NZCypher819/StruggleApp-Privacy
  PACK_ID: NZCypher819.StruggleBusMonitor
  VPK_VERSION: 1.2.161

jobs:
  test:
    name: Test Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run Windows tests
        shell: pwsh
        run: dotnet test $env:TEST_PROJECT_PATH -c Release

  release:
    name: Package and publish ${{ matrix.runtime }}
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Both runtimes upload into the same GitHub release, so they must not race to create it.
      max-parallel: 1
      matrix:
        runtime: [win-x64, win-arm64]

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The tag here is windows/v1.7.0. The releases repository and the installed app's updater
      # know the release as v1.7.0, as they always have.
      - name: Derive release version
        id: version
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ($env:TAG_NAME -notmatch '^windows/v(\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?)$') {
            throw "Tag '$env:TAG_NAME' is not windows/v followed by a supported semantic version."
          }
          "value=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Check publish token
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.STRUGGLEAPP_PRIVACY_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { throw 'The STRUGGLEAPP_PRIVACY_TOKEN Actions secret is not configured.' }

      - name: Publish ${{ matrix.runtime }} build
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT_PATH `
            -c Release `
            -r ${{ matrix.runtime }} `
            --self-contained true `
            -p:UseAppHost=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:ContinuousIntegrationBuild=true `
            -p:Version=${{ steps.version.outputs.value }} `
            -o .\publish

      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install -g vpk --version $env:VPK_VERSION

      # Fetching the previous release lets vpk build a small delta package. The first release on a
      # channel has nothing to fetch, so a failure here is not fatal.
      - name: Download previous release
        shell: pwsh
        continue-on-error: true
        run: |
          vpk download github `
            --repoUrl "https://github.com/$env:DESTINATION_REPOSITORY" `
            --channel ${{ matrix.runtime }} `
            --outputDir .\Releases

      - name: Pack installer and update packages
        shell: pwsh
        run: |
          vpk pack `
            --packId $env:PACK_ID `
            --packVersion ${{ steps.version.outputs.value }} `
            --packDir .\publish `
            --runtime ${{ matrix.runtime }} `
            --channel ${{ matrix.runtime }} `
            --mainExe StruggleBusMonitor.exe `
            --packTitle "StruggleBus Monitor" `
            --icon $env:ICON_PATH `
            --outputDir .\Releases

      - name: Upload to public release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.STRUGGLEAPP_PRIVACY_TOKEN }}
        run: |
          vpk upload github `
            --repoUrl "https://github.com/$env:DESTINATION_REPOSITORY" `
            --token $env:GH_TOKEN `
            --channel ${{ matrix.runtime }} `
            --outputDir .\Releases `
            --tag v${{ steps.version.outputs.value }} `
            --releaseName "StruggleBus Monitor v${{ steps.version.outputs.value }}" `
            --publish `
            --merge
