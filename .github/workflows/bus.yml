name: Bus

# Tests, the complexity and coverage gate, and the security checks for the bus.
# Runs on GitHub's own runners and holds no secrets, so pull requests from forks
# are welcome.
on:
  push:
    branches: [main]
    paths:
      - 'bus/**'
      - '.github/workflows/bus.yml'
  pull_request:
    paths:
      - 'bus/**'
      - '.github/workflows/bus.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bus-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: bus

jobs:
  test:
    name: Test bus (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: bus/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-extras

      - name: Verify production dependency lock
        run: uv run python scripts/check_requirements_lock.py

      - name: Run tests
        run: >-
          uv run pytest -n 4 --dist worksteal
          --cov=src/strugglebus --cov-report=json:.metrics/coverage-gate.json --cov-report=

      # Every function under CRAP 10 and line coverage of at least 85%.
      - name: Check complexity and coverage
        run: uv run python scripts/quality_gate.py .metrics/coverage-gate.json

      - name: Build distributions
        run: uv build

      - name: Verify distribution contents
        run: uv run python scripts/validate_release_artifacts.py dist

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          python-version: "3.13"
          enable-cache: false

      - name: Install locked security tools
        run: uv sync --locked --no-default-groups --group security

      - name: Audit locked production dependencies
        run: >-
          uv run --no-sync pip-audit
          --requirement requirements.lock
          --require-hashes
          --disable-pip
          --strict
          --progress-spinner off

      - name: Scan Python security
        run: |
          uv run --no-sync bandit \
            --configfile .bandit.yaml \
            --recursive src deploy scripts \
            --severity-level low \
            --confidence-level medium
