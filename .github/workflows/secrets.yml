name: Secrets scan

# Looks through every commit for anything shaped like a key, token or password.
# This repository is public, so a slip here is a leak.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out every commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The image is pinned by digest, so the scanner cannot change underneath us.
      - name: Scan with gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source /repo --redact --no-banner --exit-code 1
