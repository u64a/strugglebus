---
- name: Validate maintenance release inputs
  ansible.builtin.import_tasks: validate.yml

- name: Require an explicit typed maintenance approval
  ansible.builtin.assert:
    that:
      - strugglebus_maintenance_approval is defined
      - strugglebus_maintenance_approval == 'deploy-' + strugglebus_release_version
    fail_msg: >-
      Pass strugglebus_maintenance_approval=deploy-<release-version>. This also
      accepts replacement of the previous completed recovery point, but only
      after this upgrade's verified snapshot is durably pinned.

- name: Resolve the currently selected release
  ansible.builtin.command:
    argv: [readlink, -e, "{{ strugglebus_current_link }}"]
  register: strugglebus_maintenance_current
  changed_when: false
  failed_when: strugglebus_maintenance_current.rc not in [0, 1]
  check_mode: false

- name: Require an existing installation to upgrade
  ansible.builtin.assert:
    that:
      - strugglebus_maintenance_current.rc == 0
      - >-
        strugglebus_maintenance_current.stdout
        == strugglebus_release_root + '/'
           + (strugglebus_maintenance_current.stdout | basename)
    fail_msg: >-
      Maintenance requires an existing managed selection; use the
      initial_install action for a first activation.

- name: Initialize exact maintenance release identity
  ansible.builtin.set_fact:
    strugglebus_release_identity_content: |
      STRUGGLEBUS_RELEASE_ID={{ strugglebus_release_version }}
    strugglebus_expected_installed_marker: |
      wheel_filename={{ strugglebus_wheel_src | basename }}
      wheel_sha256={{ strugglebus_wheel_sha256 }}
      requirements_lock_sha256={{ strugglebus_requirements_lock_sha256 }}
      agent_access_freeze=global-v1

- name: Inspect exact controller release artifacts
  ansible.builtin.stat:
    path: "{{ item.path }}"
    checksum_algorithm: sha256
    follow: false
  loop:
    - path: "{{ strugglebus_wheel_src }}"
      expected: "{{ strugglebus_wheel_sha256 }}"
    - path: "{{ strugglebus_requirements_lock_src }}"
      expected: "{{ strugglebus_requirements_lock_sha256 }}"
  delegate_to: localhost
  become: false
  register: strugglebus_maintenance_local_artifacts

- name: Require exact controller release artifact checksums
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(true))
      - item.stat.checksum == item.item.expected
  loop: "{{ strugglebus_maintenance_local_artifacts.results }}"

- name: Validate the hash-locked dependency artifact
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/../../../scripts/validate_requirements_lock.py"
      - "{{ strugglebus_requirements_lock_src }}"
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false

- name: Verify immutable release state
  ansible.builtin.include_tasks: immutable_preflight.yml

- name: Materialize the exact candidate release before the outage
  ansible.builtin.include_tasks: materialize_release.yml
  when: not ansible_check_mode

# Caddy is upgraded before the renewal helper, which relies on a reload that
# Debian's 2.6.2 could not survive. The package never restarts Caddy itself.
- name: Upgrade Caddy from its own repository before the outage
  ansible.builtin.include_role:
    name: caddy
    tasks_from: package.yml
  when: not ansible_check_mode

- name: Find the satellite proxy configuration
  ansible.builtin.stat:
    path: /etc/strugglebus-satellite/Caddyfile
  register: strugglebus_maintenance_satellite_caddyfile
  when: not ansible_check_mode

- name: Validate every Caddy configuration with the installed Caddy
  ansible.builtin.command:
    argv: [/usr/bin/caddy, validate, --adapter, caddyfile, --config, "{{ item }}"]
  loop: >-
    {{ ['/etc/caddy/Caddyfile']
       + (['/etc/strugglebus-satellite/Caddyfile']
          if strugglebus_maintenance_satellite_caddyfile.stat.exists else []) }}
  changed_when: false
  when: not ansible_check_mode

- name: Activate the upgraded Caddy
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
  loop: >-
    {{ ['caddy']
       + (['strugglebus-satellite-proxy']
          if strugglebus_maintenance_satellite_caddyfile.stat.exists else []) }}
  when:
    - not ansible_check_mode
    - caddy_package_result is changed

- name: Install the reviewed proxy watchdog helper
  ansible.builtin.copy:
    src: "{{ role_path }}/../caddy/files/strugglebus-proxy-watchdog"
    dest: /usr/local/libexec/strugglebus-proxy-watchdog
    owner: root
    group: root
    mode: "0755"
    validate: /usr/bin/bash -n %s
  when: not ansible_check_mode

- name: Inspect the reviewed certificate renewal helper on the controller
  ansible.builtin.stat:
    path: "{{ role_path }}/../lan_ca/files/strugglebus-renew-certificate.sh"
    checksum_algorithm: sha256
    follow: false
  delegate_to: localhost
  become: false
  register: strugglebus_maintenance_renewal_helper_source
  when: not ansible_check_mode

- name: Install the reviewed certificate renewal helper before the outage
  ansible.builtin.copy:
    src: "{{ role_path }}/../lan_ca/files/strugglebus-renew-certificate.sh"
    dest: /usr/local/libexec/strugglebus-renew-certificate
    owner: root
    group: root
    mode: "0755"
    validate: /usr/bin/bash -n %s
  when: not ansible_check_mode

- name: Verify the installed certificate renewal helper
  ansible.builtin.stat:
    path: /usr/local/libexec/strugglebus-renew-certificate
    checksum_algorithm: sha256
    follow: false
  register: strugglebus_maintenance_renewal_helper
  when: not ansible_check_mode

- name: Require the exact reviewed certificate renewal helper
  ansible.builtin.assert:
    that:
      - strugglebus_maintenance_renewal_helper.stat.isreg | default(false)
      - not (strugglebus_maintenance_renewal_helper.stat.islnk | default(true))
      - strugglebus_maintenance_renewal_helper.stat.nlink == 1
      - strugglebus_maintenance_renewal_helper.stat.pw_name == 'root'
      - strugglebus_maintenance_renewal_helper.stat.gr_name == 'root'
      - strugglebus_maintenance_renewal_helper.stat.mode == '0755'
      - strugglebus_maintenance_renewal_helper_source.stat.isreg | default(false)
      - not (strugglebus_maintenance_renewal_helper_source.stat.islnk | default(true))
      - >-
        strugglebus_maintenance_renewal_helper.stat.checksum
        == strugglebus_maintenance_renewal_helper_source.stat.checksum
  when: not ansible_check_mode

- name: Stage and validate maintenance configuration without configuring the predecessor
  ansible.builtin.include_tasks: maintenance_configuration.yml
  when: not ansible_check_mode

- name: Perform the maintenance window
  when: not ansible_check_mode
  block:
    - name: Renew ownership before the bounded maintenance invocation
      ansible.builtin.include_tasks: renew_lock.yml

    - name: Execute the fenced recoverable maintenance lifecycle
      ansible.builtin.command:
        argv:
          - /usr/bin/timeout
          - --signal=TERM
          - --kill-after=10s
          - "{{ [900, (strugglebus_release_lock_lease_seconds | default(7200)) - 60] | min }}s"
          - /usr/bin/python3.13
          - -I
          - "{{ strugglebus_maintenance_helper_root }}/strugglebus-maintenance"
          - run
        stdin: >-
          {{
            {
              'request': strugglebus_maintenance_request,
              'locks': [
                {
                  'metadata': '/run/lock/strugglebus/release.json',
                  'token': strugglebus_release_lock_metadata.token
                },
                {
                  'metadata': strugglebus_data_dir + '/.access-freeze-lock/release.json',
                  'token': strugglebus_access_freeze_lock_metadata.token
                }
              ]
            } | to_json
          }}
      register: strugglebus_maintenance_result
      changed_when: true
      no_log: true

    - name: Report verified maintenance completion
      ansible.builtin.debug:
        msg: "{{ strugglebus_maintenance_result.stdout | from_json }}"
  rescue:
    - name: Read durable maintenance failure status
      ansible.builtin.command:
        argv:
          - /usr/bin/python3.13
          - -I
          - "{{ strugglebus_maintenance_helper_root }}/strugglebus-maintenance"
          - status
      register: strugglebus_maintenance_failure_status
      changed_when: false

    # The invocation above runs under no_log because its stdin carries release
    # and freeze ownership tokens, which suppresses the helper's curated stderr
    # reason as well. This file carries only that curated text, so the reason
    # can be reported without ever unmasking the tokens.
    - name: Read the recorded maintenance failure reason
      ansible.builtin.slurp:
        src: "{{ strugglebus_state_dir | default('/var/lib/strugglebus-maintenance') }}/last-failure.json"
      register: strugglebus_maintenance_failure_reason
      failed_when: false

    - name: Report blocked maintenance without claiming rollback
      ansible.builtin.fail:
        msg: >-
          Maintenance did not complete. Reason:
          {{
            (strugglebus_maintenance_failure_reason.content | b64decode | from_json).reason
            if strugglebus_maintenance_failure_reason.content is defined
            else 'not recorded; inspect the guest journal'
          }}.
          Durable status:
          {{ strugglebus_maintenance_failure_status.stdout | from_json }}.
          If that status shows error cleanup-failed at stop-intent, check
          "systemctl is-active strugglebus.service" first: a killed stop leaves
          the unit failed, which no rerun can clear on an older helper.
          Otherwise rerun the exact candidate/configuration to reconcile forward.
          No predecessor restart or database restoration was authorized.
          An irrecoverable candidate requires protected, compatible manual
          recovery; preserve current schema, freeze and credential state.

- name: Report maintenance validation deferred by check mode
  ansible.builtin.debug:
    msg: >-
      Check mode validated exact artifacts and immutable state without staging
      configuration, stopping services, creating backups or changing selection.
      Candidate configuration/runtime and recoverability validation are deferred
      until the exact candidate and protected maintenance runtime are staged;
      check mode is not a successful deployment or an end-to-end rehearsal.
  when: ansible_check_mode
