---
- name: Require Debian 13
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Debian"
      - ansible_facts.distribution_major_version == "13"
    fail_msg: Strugglebus production is supported only on Debian 13.

- name: Install runtime prerequisites
  ansible.builtin.apt:
    name:
      - acl
      - ca-certificates
      - curl
      - openssl
      - python3-packaging
      - python3.13
      - python3.13-venv
      - sqlite3
      - util-linux
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Validate the pinned uv runtime artifact
  ansible.builtin.assert:
    that:
      - strugglebus_uv_src not in ["", "CHANGE_ME"]
      - strugglebus_uv_sha256 is match('^[0-9a-f]{64}$')
    fail_msg: Supply the Linux x86-64 uv binary and its SHA-256 digest.

- name: Inspect the local uv runtime artifact
  ansible.builtin.stat:
    path: "{{ strugglebus_uv_src }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: local_uv

- name: Verify the local uv runtime checksum
  ansible.builtin.assert:
    that:
      - local_uv.stat.isreg | default(false)
      - local_uv.stat.checksum == strugglebus_uv_sha256
    fail_msg: The supplied uv binary is missing or has the wrong checksum.

- name: Install the pinned uv runtime
  ansible.builtin.copy:
    src: "{{ strugglebus_uv_src }}"
    dest: /usr/local/bin/uv
    owner: root
    group: root
    mode: "0755"
  register: strugglebus_uv_copy

- name: Inspect the installed uv runtime
  ansible.builtin.stat:
    path: /usr/local/bin/uv
    checksum_algorithm: sha256
    follow: false
  register: installed_uv
  check_mode: false
  when: >-
    not ansible_check_mode
    or not (strugglebus_uv_copy.changed | default(false))

- name: Verify the installed uv runtime checksum
  ansible.builtin.assert:
    that:
      - installed_uv.stat.isreg | default(false)
      - not (installed_uv.stat.islnk | default(true))
      - installed_uv.stat.nlink | default(0) == 1
      - installed_uv.stat.executable | default(false)
      - installed_uv.stat.pw_name | default("") == "root"
      - installed_uv.stat.gr_name | default("") == "root"
      - installed_uv.stat.mode | default("") == "0755"
      - installed_uv.stat.checksum == strugglebus_uv_sha256
    fail_msg: Installed uv binary failed identity, mode, or SHA-256 verification.
  when: >-
    not ansible_check_mode
    or not (strugglebus_uv_copy.changed | default(false))

- name: Inspect the production Python interpreter
  ansible.builtin.stat:
    path: /usr/bin/python3.13
    follow: false
  register: strugglebus_python_interpreter

- name: Require the protected production Python interpreter
  ansible.builtin.assert:
    that:
      - strugglebus_python_interpreter.stat.isreg | default(false)
      - not (strugglebus_python_interpreter.stat.islnk | default(true))
      - strugglebus_python_interpreter.stat.executable | default(false)
      - strugglebus_python_interpreter.stat.pw_name | default("") == "root"
      - strugglebus_python_interpreter.stat.gr_name | default("") == "root"
      - not (strugglebus_python_interpreter.stat.wgrp | default(true))
      - not (strugglebus_python_interpreter.stat.woth | default(true))
    fail_msg: >-
      /usr/bin/python3.13 is missing or unsafe; deployment helper execution
      cannot proceed.

- name: Inspect the service-user privilege drop binary
  ansible.builtin.stat:
    path: /usr/sbin/runuser
    follow: false
  register: strugglebus_runuser_binary

- name: Require the protected util-linux privilege drop binary
  ansible.builtin.assert:
    that:
      - strugglebus_runuser_binary.stat.isreg | default(false)
      - not (strugglebus_runuser_binary.stat.islnk | default(true))
      - strugglebus_runuser_binary.stat.executable | default(false)
      - strugglebus_runuser_binary.stat.pw_name | default("") == "root"
      - strugglebus_runuser_binary.stat.gr_name | default("") == "root"
      - not (strugglebus_runuser_binary.stat.wgrp | default(true))
      - not (strugglebus_runuser_binary.stat.woth | default(true))
    fail_msg: >-
      /usr/sbin/runuser from util-linux is missing or unsafe; service-user
      execution cannot proceed.

- name: Create the local helper directory
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Validate and install the root-owned release helpers
  ansible.builtin.include_tasks: validated_python_helper.yml
  loop:
    - source: "{{ role_path }}/files/strugglebus-release-lock.py"
      destination: /usr/local/libexec/strugglebus-release-lock
      destination_python: /usr/bin/python3.13
      sha256: 9335ed5a2f5341dd2e5a96dffa529870cebb4d2d14f8503f8303c6529a5960bb
      owner: root
      group: root
      mode: "0755"
      install_task: Install the process-owned release lock helper
      callables:
        - LockError
        - acquire
        - release
        - renew
        - main
      contract: ""
    - source: "{{ role_path }}/files/strugglebus-validate-release.py"
      destination: /usr/local/libexec/strugglebus-validate-release
      destination_python: /usr/bin/python3.13
      sha256: 5247e7b707412c76a6b0f27cbc66d13e52c8f6296ef9e5c9f4c1c1d52ab93972
      owner: root
      group: root
      mode: "0755"
      install_task: Install the immutable release validator
      callables:
        - ReleaseValidationError
        - validate_release
        - main
      contract: ""
    - source: "{{ role_path }}/files/strugglebus-validate-backup.py"
      destination: /usr/local/libexec/strugglebus-validate-backup
      destination_python: /usr/bin/python3.13
      sha256: aad645bf2ac983048b71cd6f973a2e3ee47e1ecdbb6b0571981050f1191a9150
      owner: root
      group: root
      mode: "0755"
      install_task: Install the protected rollback backup validator
      callables:
        - BackupValidationError
        - validate_backup
        - main
      contract: ""
  loop_control:
    loop_var: strugglebus_python_helper

- name: Configure private release safety directories
  ansible.builtin.copy:
    content: |
      d /run/lock/strugglebus 0700 root root -
      d /var/lib/strugglebus-release-staging 0700 root root 1d
    dest: /etc/tmpfiles.d/strugglebus-release-lock.conf
    owner: root
    group: root
    mode: "0644"

- name: Materialize private release safety directories
  ansible.builtin.command:
    argv:
      - systemd-tmpfiles
      - --create
      - /etc/tmpfiles.d/strugglebus-release-lock.conf
  changed_when: false

- name: Validate and install the access-freeze inspector
  ansible.builtin.include_tasks: validated_python_helper.yml
  loop:
    - source: "{{ role_path }}/files/strugglebus-inspect-access-freeze.py"
      destination: /usr/local/libexec/strugglebus-inspect-access-freeze
      destination_python: /usr/bin/python3.13
      sha256: 6dc98305ef1326235803e79ea2b629ec5a3ac180159768d194fdf53c7e2ff9d9
      owner: root
      group: root
      mode: "0755"
      install_task: Install the read-only access-freeze inspector
      callables:
        - FreezeInspectionError
        - inspect_access_freeze
        - main
      contract: "{{ role_path }}/../../files/strugglebus_inspector_contract.py"
  loop_control:
    loop_var: strugglebus_python_helper

- name: Require the fixed production service identity
  ansible.builtin.assert:
    that:
      - strugglebus_service_user == "strugglebus"
      - strugglebus_service_group == "strugglebus"
    fail_msg: The production service identity must remain strugglebus:strugglebus.

- name: Create the service group
  ansible.builtin.group:
    name: "{{ strugglebus_service_group }}"
    system: true
    state: present

- name: Create the non-login service account
  ansible.builtin.user:
    name: "{{ strugglebus_service_user }}"
    group: "{{ strugglebus_service_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ strugglebus_data_dir }}"
    create_home: false
    password_lock: true
    state: present

- name: Validate and install the inspector contract
  ansible.builtin.include_tasks: validated_python_helper.yml
  loop:
    - source: "{{ role_path }}/../../files/strugglebus_inspector_contract.py"
      destination: /usr/local/libexec/strugglebus-inspector-contract
      destination_python: /usr/bin/python3.13
      sha256: 7f9cad75f66e14aee399867d0e64fcf821f127c37d6f08d7114ba39cd2de1459
      owner: root
      group: root
      mode: "0755"
      install_task: Install the inspector contract
      callables:
        - InspectorContractError
        - verify_inspector_contract
        - main
      contract: ""
  loop_control:
    loop_var: strugglebus_python_helper

- name: Create protected service directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ strugglebus_release_root }}"
      owner: root
      group: "{{ strugglebus_service_group }}"
      mode: "0750"
    - path: "{{ strugglebus_data_dir }}"
      owner: "{{ strugglebus_service_user }}"
      group: "{{ strugglebus_service_group }}"
      mode: "0750"
    - path: "{{ strugglebus_data_dir }}/.access-freeze-lock"
      owner: "{{ strugglebus_service_user }}"
      group: "{{ strugglebus_service_group }}"
      mode: "0700"
    - path: "{{ strugglebus_backup_dir }}"
      owner: "{{ strugglebus_service_user }}"
      group: "{{ strugglebus_service_group }}"
      mode: "0700"
    - path: "{{ strugglebus_config_dir }}"
      owner: root
      group: "{{ strugglebus_service_group }}"
      mode: "0750"
    - path: "{{ strugglebus_config_dir }}/credentials"
      owner: root
      group: root
      mode: "0700"

- name: Explain the firewall boundary
  ansible.builtin.debug:
    msg: >-
      This role opens no management port. Enforce LAN-only TCP/443 access and
      management access separately at the Proxmox/datacenter firewall boundary.
