---
- name: Require an updater socket outside application writable directories
  ansible.builtin.assert:
    that:
      - updater_socket is string
      - >-
        updater_socket == '' or (
          updater_socket is match('^/[A-Za-z0-9_./-]+$')
          and updater_socket | length <= 107
          and '..' not in updater_socket.split('/')
          and '.' not in updater_socket.split('/')
          and '//' not in updater_socket
          and not updater_socket.endswith('/')
          and updater_socket != item
          and not updater_socket.startswith(item ~ '/')
        )
    fail_msg: Updater IPC must use a protected absolute socket path outside application storage.
  vars:
    updater_socket: "{{ strugglebus_updater_socket_path | default('') }}"
  loop:
    - "{{ strugglebus_data_dir }}"
    - "{{ strugglebus_runtime_dir }}"
    - "{{ strugglebus_backup_dir }}"

- name: Validate explicitly configured updater application ceilings
  ansible.builtin.assert:
    that:
      - vars['strugglebus_' ~ item.name] is integer
      - vars['strugglebus_' ~ item.name] >= 1
      - vars['strugglebus_' ~ item.name] <= item.maximum
    fail_msg: Updater application limits may only narrow the approved ceilings.
  when: ('strugglebus_' ~ item.name) in vars
  loop:
    - {name: updater_confirm_session_per_minute, maximum: 3}
    - {name: updater_confirm_global_per_minute, maximum: 6}
    - {name: updater_review_seconds, maximum: 300}
    - {name: updater_review_tickets, maximum: 8}

- name: Validate the optional guest-side operator credential reference
  ansible.builtin.assert:
    that:
      - strugglebus_operator_password_source | default('') is string
      - >-
        strugglebus_operator_password_source | default('') == ''
        or (
          strugglebus_operator_password_source is match('^/[A-Za-z0-9_./-]+$')
          and strugglebus_operator_password_source
              != strugglebus_config_dir + '/credentials/admin-token'
          and strugglebus_operator_password_source != strugglebus_database_path
          and not strugglebus_operator_password_source.startswith('/run/credentials/')
        )
    fail_msg: Set only a canonical guest-side operator verifier path, never a password value.
  no_log: true

- name: Validate an existing guest verifier without copying or exposing it
  ansible.builtin.command:
    argv:
      - /usr/bin/python3.13
      - -I
      - -c
      - |
        import os, pathlib, re, stat, sys
        def require(condition):
            if not condition:
                raise SystemExit("operator credential preflight refused")
        try:
            path = pathlib.Path(sys.argv[1])
            require(os.geteuid() == 0 and path.is_absolute())
            require(path.resolve(strict=True) == path and ".." not in path.parts)
            require(path.name not in {".operator-password.control", ".operator-password.authorization"})
            for parent in path.parents:
                info = parent.lstat()
                require(stat.S_ISDIR(info.st_mode) and info.st_uid == 0 and not info.st_mode & 0o022)
            require(stat.S_IMODE(path.parent.lstat().st_mode) == 0o700)
            fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
            try:
                before = os.fstat(fd)
                require(stat.S_ISREG(before.st_mode) and before.st_uid == 0)
                require(stat.S_IMODE(before.st_mode) == 0o600 and before.st_nlink == 1)
                require(before.st_size <= 256)
                value = os.read(fd, 257)
                after = path.lstat()
                require(all(getattr(before, field) == getattr(after, field) for field in
                            ("st_dev", "st_ino", "st_size", "st_mtime_ns", "st_ctime_ns")))
                require(re.fullmatch(rb"sbop1\$600000\$[0-9a-f]{32}\$[0-9a-f]{64}\n?", value) is not None)
            finally:
                os.close(fd)
        except (OSError, ValueError):
            raise SystemExit("operator credential preflight refused") from None
      - "{{ strugglebus_operator_password_source }}"
  changed_when: false
  check_mode: false
  no_log: true
  when: strugglebus_operator_password_source | default('') | length > 0
