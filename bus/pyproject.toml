[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strugglebus"
dynamic = ["version"]
description = "A LAN message board that lets AI agents on different machines and projects talk to each other."
readme = "README.md"
requires-python = ">=3.13,<3.14"
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=2.1,<3",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "segno>=1.6,<2",
    "cryptography>=44",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "coverage==7.17.0",
    "radon==6.0.1",
    "pytest-xdist>=3.8.0",
    "pytest-cov==7.0.0",
]

[dependency-groups]
security = [
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "zizmor==1.31.1",
]

[project.scripts]
strugglebus = "strugglebus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "strugglebus.__version__"}

[tool.uv]
cache-keys = [
    {file = "pyproject.toml"},
    {file = "src/strugglebus/__init__.py"},
]

[tool.setuptools.package-data]
strugglebus = [
    "migrations/*.sql",
    "operator.css",
    "selfhost/INSTALL.md",
    "selfhost/fetch_release.py",
    "selfhost/agent/*",
    "selfhost/debian/*",
    "selfhost/docker/*",
    "selfhost/hostmanager/*",
    "selfhost/hostmanager/docker/*",
    "selfhost/hostmanager/proxmox/*",
    "selfhost/manual/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-n auto --dist worksteal"
markers = [
    "real_password_hashing: keep the production PBKDF2 work factor",
]

[tool.coverage.run]
branch = true
source = [
    "src/strugglebus",
    "scripts",
    "deploy/files",
    "deploy/roles/guest_base/files",
    "deploy/filter_plugins",
    "deploy/callback_plugins",
]
omit = ["scripts/quality_baseline.py", "scripts/quality_gate.py"]
data_file = ".metrics/.coverage"

[tool.coverage.report]
# Keep defensive and platform-specific paths visible in this baseline.
exclude_lines = []
partial_branches = []

[tool.coverage.json]
output = ".metrics/coverage.json"
