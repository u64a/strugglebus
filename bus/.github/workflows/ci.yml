name: CI

# Tiered gate. Pull requests into develop and pushes to develop run the fast
# tier (tests and security). Pull requests into main, pushes to main and manual
# runs also run deployment validation and the real LAN CA integration. Release
# tooling only accepts a successful push run on main, which is always full.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, prox-runner]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Production runs Debian 13's native Python 3.13, so that is what every
        # pull request exercises; it is the only supported interpreter.
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.7"
          checksum: "788f18abea7c5f55d6216e4f5613fd89d4d59b631efeec117b2b07fe72f1da21"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-extras

      - name: Verify production dependency lock
        run: uv run python scripts/check_requirements_lock.py

      - name: Run tests across the runner CPUs
        run: >-
          uv run pytest -n 4 --dist worksteal
          --cov=src/strugglebus --cov-report=json:.metrics/coverage-gate.json --cov-report=

      # Every function under CRAP 10 and line coverage of at least 85%.
      - name: Check complexity and coverage
        run: uv run python scripts/quality_gate.py .metrics/coverage-gate.json

      - name: Build distributions
        run: uv build

      - name: Verify distribution contents
        run: uv run python scripts/validate_release_artifacts.py dist

  deployment:
    name: Deployment validation
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.base_ref == 'main')
    runs-on: [self-hosted, prox-runner]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.7"
          checksum: "788f18abea7c5f55d6216e4f5613fd89d4d59b631efeec117b2b07fe72f1da21"
          python-version: "3.13"
          enable-cache: true

      - name: Install deployment validation tools
        run: |
          uv venv deploy/.ansible-venv
          uv pip install --python deploy/.ansible-venv/bin/python -r deploy/requirements-controller.txt
          echo "$GITHUB_WORKSPACE/deploy/.ansible-venv/bin" >> "$GITHUB_PATH"

      - name: Verify production dependency lock
        run: python scripts/check_requirements_lock.py

      - name: Build and inspect release artifacts
        run: |
          uv build
          python scripts/validate_release_artifacts.py dist

      - name: Validate clean Python 3.13 installation
        run: |
          set -euo pipefail
          wheels=(dist/strugglebus-*-py3-none-any.whl)
          test "${#wheels[@]}" -eq 1
          python scripts/validate_clean_install.py \
            --wheel "${wheels[0]}" \
            --requirements requirements.lock \
            --expected-python 3.13

      - name: Validate deployment
        run: python deploy/validate.py

  lan-ca-integration:
    name: Isolated LAN CA integration
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.base_ref == 'main')
    runs-on: [self-hosted, prox-runner]
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned LAN CA test tools
        run: |
          set -euo pipefail
          bin="$(bash deploy/tests/install_lan_ca_test_tools.sh)"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Exercise isolated real step-ca
        run: bash deploy/tests/lan_ca_integration.sh

  security:
    name: Security
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, prox-runner]
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.7"
          checksum: "788f18abea7c5f55d6216e4f5613fd89d4d59b631efeec117b2b07fe72f1da21"
          python-version: "3.13"
          enable-cache: false

      - name: Install locked security tools
        run: uv sync --locked --no-default-groups --group security

      - name: Audit locked production dependencies
        run: >-
          uv run --no-sync pip-audit
          --requirement requirements.lock
          --require-hashes
          --disable-pip
          --strict
          --progress-spinner off

      - name: Scan Python security
        run: |
          uv run --no-sync bandit \
            --configfile .bandit.yaml \
            --recursive src deploy scripts \
            --severity-level low \
            --confidence-level medium

      - name: Audit GitHub Actions security
        run: uv run --no-sync zizmor --offline --strict-collection .

      - name: Scan Git history for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-${GITLEAKS_VERSION}"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --retry 3 \
            --show-error \
            --silent \
            --tlsv1.2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check
          mkdir --parents "$install_dir"
          tar --extract --file "$archive" --gzip --directory "$install_dir" gitleaks
          "$install_dir/gitleaks" version
          "$install_dir/gitleaks" git \
            --redact=100 \
            --no-banner \
            --no-color \
            --timeout 120 \
            "$GITHUB_WORKSPACE"
