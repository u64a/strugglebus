version: 2
updates:
  - package-ecosystem: pip
    directory: /
    # Pull requests go to develop; main only receives promotions.
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    # Pull requests go to develop; main only receives promotions.
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
